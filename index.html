<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUNÉA — Jewelry & Accessories</title>
  <meta name="description" content="LUNÉA Jewelry & Accessories — Discover elegant rings, bracelets, necklaces and accessories.">
  <meta name="keywords" content="LUNÉA, jewelry, rings, bracelets, necklaces, Morocco">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #C8A96B;
      --ivory: #F7F3EA;
      --espresso: #241D1A;
      --nude: #D8C4B5;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--ivory);
      color: var(--espresso);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
    }

    /* SHIPPING BAR */

    .shipping {
      background: var(--espresso);
      color: var(--ivory);
      text-align: center;
      padding: 9px;
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    /* NAVBAR */

    nav {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      background: rgba(247,243,234,0.96);
      border-bottom: 1px solid rgba(36,29,26,0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--espresso);
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 30px;
      font-size: 11px;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    /* HERO */

    .hero {
      min-height: 78vh;
      background:
        linear-gradient(rgba(36,29,26,.35), rgba(36,29,26,.48)),
        url("https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1800&q=85")
        center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 40px 20px;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero small {
      letter-spacing: 4px;
      font-size: 12px;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(60px, 10vw, 120px);
      font-weight: 500;
      letter-spacing: 5px;
      margin: 15px 0;
    }

    .hero p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-style: italic;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: var(--gold);
      color: white;
      padding: 14px 30px;
      font-size: 11px;
      letter-spacing: 2px;
      transition: .3s;
    }

    .btn:hover {
      background: white;
      color: var(--espresso);
    }

    /* SECTION */

    section {
      padding: 90px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title span {
      display: block;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .section-title h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px;
      font-weight: 500;
    }

    /* COLLECTIONS */

    .collections {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .collection {
      height: 330px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .collection img {
      height: 100%;
      object-fit: cover;
      transition: transform .6s;
    }

    .collection:hover img {
      transform: scale(1.06);
    }

    .collection-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent, rgba(0,0,0,.65));
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 30px;
      color: white;
    }

    .collection-overlay h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 500;
    }

    /* PRODUCTS */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .product {
      background: white;
      padding-bottom: 22px;
      transition: transform .3s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product-image {
      height: 320px;
      overflow: hidden;
      background: #eee;
    }

    .product-image img {
      height: 100%;
      object-fit: cover;
      transition: transform .5s;
    }

    .product:hover img {
      transform: scale(1.04);
    }

    .product-info {
      padding: 18px;
      text-align: center;
    }

    .product-info h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 23px;
      font-weight: 600;
    }

    .price {
      color: var(--gold);
      margin: 5px 0 15px;
      font-size: 14px;
    }

    .product-btn {
      border: 1px solid var(--espresso);
      background: transparent;
      padding: 10px 18px;
      font-size: 9px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: .3s;
    }

    .product-btn:hover {
      background: var(--espresso);
      color: white;
    }

    /* ABOUT */

    .about {
      background: var(--espresso);
      color: var(--ivory);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 70px;
    }

    .about-image img {
      height: 550px;
      object-fit: cover;
    }

    .about-text span {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
    }

    .about-text h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 55px;
      font-weight: 500;
      margin: 12px 0 20px;
    }

    .about-text p {
      color: #d9d1c8;
      font-size: 14px;
      line-height: 2;
      max-width: 520px;
    }

    /* NEWSLETTER */

    .newsletter {
      text-align: center;
      background: var(--nude);
    }

    .newsletter h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 45px;
      font-weight: 500;
    }

    .newsletter p {
      margin: 10px 0 25px;
      font-size: 13px;
    }

    .newsletter-form {
      display: flex;
      max-width: 500px;
      margin: auto;
    }

    .newsletter-form input {
      flex: 1;
      border: none;
      padding: 15px;
      outline: none;
      font-family: inherit;
    }

    .newsletter-form button {
      border: none;
      background: var(--espresso);
      color: white;
      padding: 0 25px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    /* FOOTER */

    footer {
      background: #171210;
      color: #ddd;
      padding: 50px 7% 25px;
      text-align: center;
    }

    .footer-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      letter-spacing: 5px;
      color: white;
    }

    .footer-logo span {
      color: var(--gold);
    }

    .footer-subtitle {
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 3px;
      margin-top: 5px;
    }

    .socials {
      margin: 25px 0;
      display: flex;
      justify-content: center;
      gap: 25px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .socials a:hover {
      color: var(--gold);
    }

    .copyright {
      border-top: 1px solid rgba(255,255,255,.1);
      padding-top: 20px;
      color: #888;
      font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      nav {
        padding: 0 5%;
      }

      .logo {
        font-size: 25px;
      }

      .nav-links {
        display: none;
      }

      section {
        padding: 65px 5%;
      }

      .hero {
        min-height: 70vh;
      }

      .hero h1 {
        font-size: 65px;
      }

      .hero p {
        font-size: 22px;
      }

      .collections {
        grid-template-columns: repeat(2, 1fr);
      }

      .collection {
        height: 250px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 230px;
      }

      .about {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .about-image img {
        height: 400px;
      }

      .about-text h2 {
        font-size: 45px;
      }

      .newsletter-form {
        flex-direction: column;
        gap: 8px;
      }

      .newsletter-form button {
        padding: 14px;
      }
    }

    @media (max-width: 480px) {

      .collections {
        grid-template-columns: 1fr 1fr;
      }

      .products {
        grid-template-columns: 1fr 1fr;
      }

      .product-image {
        height: 200px;
      }

      .product-info h3 {
        font-size: 19px;
      }

      .section-title h2 {
        font-size: 40px;
      }
    }
  </style>
</head>
